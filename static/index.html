<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Tweet Search</title>
<style>
  * { box-sizing: border-box; }

  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 0.9; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 12px 2px rgba(140, 120, 255, 0.35); }
    50%      { box-shadow: 0 0 22px 6px rgba(140, 120, 255, 0.6); }
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  html, body {
    min-height: 100%;
  }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 40px 20px 60px;
    color: #eef0ff;
    background: radial-gradient(circle at 18% 20%, rgba(124, 92, 255, 0.45), transparent 42%),
                radial-gradient(circle at 82% 12%, rgba(56, 189, 248, 0.35), transparent 40%),
                radial-gradient(circle at 55% 88%, rgba(192, 132, 252, 0.35), transparent 45%),
                linear-gradient(120deg, #1b1042, #2a1657, #12224f, #401b5c, #14163f);
    background-size: 200% 200%, 200% 200%, 200% 200%, 300% 300%;
    animation: drift 18s ease-in-out infinite;
    min-height: 100vh;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.9rem;
    margin: 0 0 6px;
    text-align: center;
    font-weight: 700;
  }

  .gradient-text {
    background: linear-gradient(90deg, #a78bfa, #60d0ff, #c084fc, #a78bfa);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
  }

  .subtitle {
    color: #c7c9ea;
    font-size: 0.85rem;
    text-align: center;
    margin: 0 auto 28px;
    max-width: 480px;
    line-height: 1.5;
  }

  .panel {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 20px;
    padding: 22px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  input[type="text"], select {
    font-size: 1rem;
    padding: 12px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.08);
    color: #f5f5ff;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  input[type="text"]::placeholder { color: #9ea1cf; }
  input[type="text"] { flex: 1; min-width: 160px; }
  select { cursor: pointer; }
  select option { color: #1a1a1a; }

  input[type="text"]:focus, select:focus {
    border-color: #a78bfa;
    background: rgba(255, 255, 255, 0.13);
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.25);
  }

  button {
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 24px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #7c5cff, #38bdf8);
    color: white;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    box-shadow: 0 4px 16px rgba(124, 92, 255, 0.45);
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124, 92, 255, 0.6); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.55; cursor: default; box-shadow: none; }

  #status {
    font-size: 0.95rem;
    margin: 16px 2px 0;
    min-height: 1.3em;
    color: #d7d9ff;
  }
  #status.error { color: #ffb4c6; }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 3px solid rgba(255, 255, 255, 0.25);
    border-top-color: #c084fc;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  .cache-note {
    display: inline-block;
    font-size: 0.75rem;
    color: #c7c9ea;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 999px;
    padding: 3px 12px;
    margin: 14px 0 6px;
  }

  #results { margin-top: 14px; }

  .card {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: rise-in 0.35s ease-out backwards;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: rgba(167, 139, 250, 0.5);
    box-shadow: 0 10px 28px rgba(124, 92, 255, 0.25);
  }

  .card .snippet {
    margin: 0 0 12px;
    line-height: 1.5;
    color: #f0f1ff;
  }

  .card a {
    display: inline-block;
    color: #d9c9ff;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(167, 139, 250, 0.18);
    border: 1px solid rgba(167, 139, 250, 0.4);
    transition: background 0.2s, border-color 0.2s;
  }
  .card a:hover {
    background: rgba(167, 139, 250, 0.3);
    border-color: rgba(167, 139, 250, 0.7);
  }

  .sparkle {
    display: inline-block;
    animation: twinkle 2.4s ease-in-out infinite;
  }

  @media (max-width: 480px) {
    form { flex-direction: column; }
    input[type="text"], select, button { width: 100%; }
  }
</style>
</head>
<body>
  <div class="page">
    <h1><span class="sparkle">✨</span> <span class="gradient-text">X Tweet Search</span> <span class="sparkle">✨</span></h1>
    <p class="subtitle">
      Results come from DuckDuckGo's search index, not a live timeline read:
      they're approximate and may not be the literal last N tweets.
    </p>

    <div class="panel">
      <form id="search-form">
        <input type="text" id="handle" placeholder="Handle, e.g. jack" autocomplete="off" required>
        <select id="count">
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="10">10</option>
        </select>
        <button type="submit" id="submit-btn">Search</button>
      </form>

      <div id="status"></div>
      <div id="results"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('search-form');
    const handleInput = document.getElementById('handle');
    const countSelect = document.getElementById('count');
    const submitBtn = document.getElementById('submit-btn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    function showLoading() {
      submitBtn.disabled = true;
      statusEl.className = '';
      statusEl.innerHTML = '<span class="spinner"></span>Searching…';
    }

    function showError(message) {
      statusEl.className = 'error';
      statusEl.textContent = message;
    }

    function clearStatus() {
      statusEl.className = '';
      statusEl.textContent = '';
    }

    function notFoundMessage(handle) {
      return `No tweets found for @${handle}. They may not have an X account, ` +
             `their tweets may not be publicly indexed, or search just hasn't ` +
             `picked anything up yet — this can't be told apart for certain.`;
    }

    function renderResults(data) {
      resultsEl.innerHTML = '';
      if (!data.tweets || data.tweets.length === 0) {
        showError(notFoundMessage(data.username || handleInput.value.trim().replace(/^@/, '')));
        return;
      }
      clearStatus();

      if (data.from_cache) {
        const note = document.createElement('div');
        note.className = 'cache-note';
        note.textContent = '⚡ served from cache';
        resultsEl.appendChild(note);
      }

      data.tweets.forEach((tweet, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${i * 60}ms`;

        const snippet = document.createElement('p');
        snippet.className = 'snippet';
        snippet.textContent = tweet.snippet || tweet.title || '';
        card.appendChild(snippet);

        const link = document.createElement('a');
        link.href = tweet.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'View tweet ↗';
        card.appendChild(link);

        resultsEl.appendChild(card);
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const handle = handleInput.value.trim().replace(/^@/, '');
      if (!handle) return;
      const count = countSelect.value;

      resultsEl.innerHTML = '';
      showLoading();

      try {
        const resp = await fetch(`/tweets/${encodeURIComponent(handle)}?count=${encodeURIComponent(count)}`);

        if (resp.status === 404) {
          showError(notFoundMessage(handle));
          return;
        }
        if (resp.status === 429) {
          showError('Rate limited, try again shortly');
          return;
        }
        if (!resp.ok) {
          showError('Something went wrong. Try again.');
          return;
        }

        const data = await resp.json();
        renderResults(data);
      } catch (err) {
        showError('Network error. Check your connection and try again.');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
