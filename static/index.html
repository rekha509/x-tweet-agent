<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Tweet Search</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 48px auto;
    padding: 0 20px;
    color: #1a1a1a;
    background: #f7f7f8;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 24px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  select {
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #1a8cd8;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #9dc9e8; cursor: default; }
  #status { font-size: 0.95rem; margin-bottom: 16px; min-height: 1.2em; }
  #status.error { color: #c62828; }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 3px solid #ddd;
    border-top-color: #1a8cd8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cache-note { font-size: 0.8rem; color: #888; margin-bottom: 12px; }
  .card {
    background: white;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card .snippet { margin: 0 0 10px; line-height: 1.4; color: #333; }
  .card a { color: #1a8cd8; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
  .card a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>X Tweet Search</h1>
  <p class="subtitle">
    Results come from DuckDuckGo's search index, not a live timeline read:
    they are approximate and may not be the literal last N tweets.
  </p>

  <form id="search-form">
    <input type="text" id="handle" placeholder="Handle, e.g. jack" autocomplete="off" required>
    <select id="count">
      <option value="3" selected>3</option>
      <option value="5">5</option>
      <option value="10">10</option>
    </select>
    <button type="submit" id="submit-btn">Search</button>
  </form>

  <div id="status"></div>
  <div id="results"></div>

  <script>
    const form = document.getElementById('search-form');
    const handleInput = document.getElementById('handle');
    const countSelect = document.getElementById('count');
    const submitBtn = document.getElementById('submit-btn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    function showLoading() {
      submitBtn.disabled = true;
      statusEl.className = '';
      statusEl.innerHTML = '<span class="spinner"></span>Searching…';
    }

    function showError(message) {
      statusEl.className = 'error';
      statusEl.textContent = message;
    }

    function clearStatus() {
      statusEl.className = '';
      statusEl.textContent = '';
    }

    function renderResults(data) {
      resultsEl.innerHTML = '';
      if (!data.tweets || data.tweets.length === 0) {
        showError('No tweets found');
        return;
      }
      clearStatus();

      if (data.from_cache) {
        const note = document.createElement('div');
        note.className = 'cache-note';
        note.textContent = 'Served from cache';
        resultsEl.appendChild(note);
      }

      for (const tweet of data.tweets) {
        const card = document.createElement('div');
        card.className = 'card';

        const snippet = document.createElement('p');
        snippet.className = 'snippet';
        snippet.textContent = tweet.snippet || tweet.title || '';
        card.appendChild(snippet);

        const link = document.createElement('a');
        link.href = tweet.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'View tweet ↗';
        card.appendChild(link);

        resultsEl.appendChild(card);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const handle = handleInput.value.trim().replace(/^@/, '');
      if (!handle) return;
      const count = countSelect.value;

      resultsEl.innerHTML = '';
      showLoading();

      try {
        const resp = await fetch(`/tweets/${encodeURIComponent(handle)}?count=${encodeURIComponent(count)}`);

        if (resp.status === 404) {
          showError('No tweets found');
          return;
        }
        if (resp.status === 429) {
          showError('Rate limited, try again shortly');
          return;
        }
        if (!resp.ok) {
          showError('Something went wrong. Try again.');
          return;
        }

        const data = await resp.json();
        renderResults(data);
      } catch (err) {
        showError('Network error. Check your connection and try again.');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
